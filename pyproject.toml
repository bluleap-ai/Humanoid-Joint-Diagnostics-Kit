[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-can-tool"
version = "0.1.0"
description = "Authenticated local wireless CAN diagnostics"
requires-python = ">=3.11"
dependencies = ["cantools==41.0.0", "rich==14.1.0", "zeroconf==0.147.0", "cryptography==45.0.7"]

[project.scripts]
can-tool = "can_tool.cli:main"

[tool.setuptools.packages.find]
where = ["pc"]

[tool.pytest.ini_options]
pythonpath = ["pc"]
testpaths = ["tests"]
